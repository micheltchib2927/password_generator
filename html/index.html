<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="generator">
        <h1>Password Generator</h1>
        <div>
            <textarea class="pw-container" placeholder="Generate Password"></textarea>
            <button class="copy"><img src="../icon/copy.svg" alt="copy" style="width: 50px; height: 40px;"></button>
        </div>
        <button class="generator-button">Generate</button>
    </div>
    <div class="popup-container"></div>
</body>
</html>
